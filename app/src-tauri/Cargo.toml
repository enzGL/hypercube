[package]
name = "hypercube"
version = "0.1.1"
description = "Hypercube: todos os seus agentes, num cubo só."
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "hypercube_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# terminais de verdade (ConPTY no Windows, openpty no resto)
portable-pty = "0.9"
# servidor local dos hooks (só 127.0.0.1)
tiny_http = "0.12"
# token aleatório do servidor de hooks
getrandom = "0.3"

[profile.release]
opt-level = "s"
strip = true
